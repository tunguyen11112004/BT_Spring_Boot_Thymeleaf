<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Độc giả')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Độc giả</h1>
        <a class="btn btn-primary" th:href="@{/members/new}">Thêm độc giả</a>
    </div>
    <div class="card">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Điện thoại</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(members)}">
                    <td colspan="5" class="text-center text-muted py-4">Chưa có độc giả.</td>
                </tr>
                <tr th:each="member : ${members}">
                    <td th:text="${member.memberCode}">DG</td>
                    <td th:text="${member.fullName}">Tên</td>
                    <td th:text="${member.email}">Email</td>
                    <td th:text="${member.phone}">ĐT</td>
                    <td class="text-end"><a th:href="@{/members/{id}/edit(id=${member.id})}">Sửa</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
