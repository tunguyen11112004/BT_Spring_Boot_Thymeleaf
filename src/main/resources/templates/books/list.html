<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách sách')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Danh sách sách</h1>
        <a class="btn btn-primary" th:href="@{/books/new}">Thêm sách</a>
    </div>
    <form class="row g-2 mb-3" method="get" th:action="@{/books}">
        <div class="col-md-8">
            <input class="form-control" type="search" name="q" th:value="${q}" placeholder="Tìm theo tên, tác giả, ISBN">
        </div>
        <div class="col-md-4">
            <button class="btn btn-outline-primary" type="submit">Tìm kiếm</button>
        </div>
    </form>
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tên sách</th>
                    <th>Tác giả</th>
                    <th>ISBN</th>
                    <th>Thể loại</th>
                    <th>Tổng</th>
                    <th>Còn mượn được</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${books.totalElements == 0}">
                    <td colspan="7" class="text-center text-muted py-4">Không có sách phù hợp.</td>
                </tr>
                <tr th:each="book : ${books}">
                    <td th:text="${book.title}">Tên</td>
                    <td th:text="${book.author}">Tác giả</td>
                    <td th:text="${book.isbn}">ISBN</td>
                    <td th:text="${book.category.name}">Thể loại</td>
                    <td th:text="${book.totalQuantity}">0</td>
                    <td>
                        <span class="badge"
                              th:classappend="${book.availableQuantity > 0} ? 'text-bg-success' : 'text-bg-danger'"
                              th:text="${book.availableQuantity}">0</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}">Sửa</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <nav class="mt-3" th:if="${books.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${!books.hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/books(q=${q},page=${books.number - 1})}">Trước</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="|Trang ${books.number + 1} / ${books.totalPages}|"></span>
            </li>
            <li class="page-item" th:classappend="${!books.hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/books(q=${q},page=${books.number + 1})}">Sau</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>
