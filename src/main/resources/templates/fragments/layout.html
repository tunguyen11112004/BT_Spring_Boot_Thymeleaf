<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">QL Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .navbar-brand { font-weight: 650; }
    </style>
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-primary mb-0">
    <div class="container">
        <a class="navbar-brand" th:href="@{/books}">QL Mượn trả sách</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/books}">Sách</a>
            <a class="nav-link" th:href="@{/members}">Độc giả</a>
            <a class="nav-link" th:href="@{/borrowings}">Phiếu mượn</a>
            <a class="nav-link" th:href="@{/fine-policies}">Phí phạt</a>
            <a class="nav-link" th:href="@{/reports/overdue}">Quá hạn</a>
        </div>
    </div>
</nav>
<div th:fragment="alerts" class="mb-3">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
</div>
</body>
</html>
