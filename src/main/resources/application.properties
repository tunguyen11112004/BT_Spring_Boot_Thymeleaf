spring.application.name=BT_QLSach

spring.datasource.url=jdbc:mysql://localhost:3306/bt_qlsach?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=BOOLEAN

spring.flyway.enabled=true
spring.sql.init.mode=never

spring.thymeleaf.cache=false
server.port=8080
server.servlet.session.tracking-modes=cookie
